name: Verificar tráfico

on:
  schedule:
    - cron: '*/5 5-9 * * 1-5'    # 07:00–10:55 CEST
    - cron: '*/5 13-16 * * 1-5'  # 15:00–17:55 CEST
  workflow_dispatch:

jobs:
  trafico:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Ejecutar script de tráfico
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - run: git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trafico_log.md
          git commit -m "🔁 Registro tráfico actualizado" || echo "Sin cambios"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
