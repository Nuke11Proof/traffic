name: Verificar tráfico

on:
  schedule:
    # Málaga: 07:00–10:55 CEST (cada 5 min) 
    - cron: '*/5 5-8 * * 1-5'
    # Málaga: 15:00–17:55 CEST (cada 5 min) 
    - cron: '*/5 13-15 * * 1-5'
    # Madrid: 06:00–08:59 CEST (cada 5 min)
    - cron: '*/5 4-6 * * 1-5'
    # Madrid: 15:00–17:59 CEST (cada 5 min)
    - cron: '*/5 13-15 * * 1-5'
  workflow_dispatch:

jobs:
  trafico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with: 
          python-version: '3.11'

      - run: pip install requests

      - name: Ejecutar main_mlg
        run: python main_mlg.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOMTOM_TOKEN: ${{ secrets.TOMTOM_TOKEN }}

      - name: Ejecutar main_mad
        run: python main_mad.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOMTOM_TOKEN: ${{ secrets.TOMTOM_TOKEN }}

      - run: git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
      - run: git fetch origin main
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          [ -f trafico_log_mlg.md ] && git add trafico_log_mlg.md
          [ -f trafico_log_mad.md ] && git add trafico_log_mad.md
          git commit -m "🔁 Registro tráfico actualizado" || echo "Sin cambios"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
