name: Verificar tráfico

on:
  repository_dispatch:
    types: [trafico]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trafico
  cancel-in-progress: false

jobs:
  trafico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - run: python3 -m pip install --quiet requests

      - name: Ejecutar main_mlg
        run: python3 main_mlg.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOMTOM_TOKEN: ${{ secrets.TOMTOM_TOKEN }}

      - name: Guardar registro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add trafico_log_mlg.md
          git commit -m "🔁 Registro tráfico actualizado" || echo "Sin cambios"
          git push origin main
